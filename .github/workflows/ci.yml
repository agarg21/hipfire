name: CI

# FORK-ONLY measurement harness (agarg21/hipfire): upstream beta ci.yml reduced
# to the `test` job, workflow_dispatch only. Not for upstream.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: unit + integration tests (no GPU)
    runs-on: ubuntu-latest
    env:
      # Belt and braces on a GPU-less runner: no test may see a device.
      ROCR_VISIBLE_DEVICES: "-1"
      HIP_VISIBLE_DEVICES: "-1"
      HIPFIRE_TEST_REQUIRE_ROCM: "0"
      # Compile the test builds with light optimisation. The CPU emulation /
      # oracle tests (hipfire-dispatch, hipfire-runtime, rdna-compute
      # all_launcher_abi, e8p/mq GEMV emulators) spend ~90 min executing
      # unoptimised code; opt-level 1 keeps debug assertions and overflow
      # checks (only the optimiser changes), so test semantics are unchanged.
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
    steps:
      - name: CPU info (fork-only)
        run: nproc && lscpu | grep -m1 'Model name'
      - name: Private hipfire lock dir
        run: echo "HIPFIRE_LOCK_DIR=$RUNNER_TEMP/hipfire-locks" >> "$GITHUB_ENV" && mkdir -p "$RUNNER_TEMP/hipfire-locks"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace lib unit tests
        # --lib only: unit tests inside library targets are GPU-free
        # (detector logic, sampler, framing, quant math). Integration
        # tests / examples that dispatch kernels need the self-hosted
        # GPU runner and are intentionally excluded here.
        run: cargo test --lib --workspace --locked
      - name: Run serve gateway tests (bin crate)
        # hipfire-cli is bin-only, so `--lib --workspace` skips it. Its tests
        # drive the OpenAI HTTP gateway against the scripted fake daemon
        # (crates/hipfire-cli/src/serve/fake_daemon.py, stdlib python3) and
        # need no GPU. hipfire-client is a lib crate and runs above.
        run: cargo test --locked -p hipfire-cli
      - name: Run GPU-free integration and bin tests
        # `--lib` skips crates/*/tests/*.rs and bin-only unit tests. These
        # crates' integration tests are GPU-free (GPU ones are #[ignore]).
        run: >-
          cargo test --locked --tests
          -p hipfire-engine -p hipfire-generate -p peacemaker-isa -p peacemaker-lift
          -p redline-dispatch -p hipfire-arch-qwen35-vl -p hipfire-detect
          -p hipfire-daemon -p saddle-quant -p hipfire-tui
      - name: Run builder-kernel CPU emulation test (no GPU)
        # Moved from peacemaker-isa: compares the builder device-accept kernel
        # with the rdna-compute host twin on the CPU interpreter.
        run: cargo test --locked -p rdna-compute --test dflash_accept_emu
      - name: Run MoE launcher ABI test (no GPU)
        run: cargo test --locked -p rdna-compute --test all_launcher_abi
      - name: Run NPU transport CPU tests
        run: cargo test --locked -p npu-tools --bin npu-trunk-transport
      - name: Run serve fault-injection tests
        run: cargo test --locked -p hipfire-generate --features serve-fault-inject --test serve_fault_inject_tests

